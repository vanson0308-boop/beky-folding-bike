<script>
(function () {
  const id = new URLSearchParams(location.search).get('id');
  const j = JOURNALS[id] || JOURNALS['summer-breeze'];
  const key = JOURNALS[id] ? id : 'summer-breeze';
  const siteUrl = 'https://vanson0308-boop.github.io/beky-folding-bike/';
  const pageUrl = `${siteUrl}journal.html?id=${encodeURIComponent(key)}`;
  const imageUrl = new URL(j.cover, siteUrl).href;

  document.getElementById('canonicalUrl').href = pageUrl;
  document.getElementById('ogUrl').content = pageUrl;
  document.getElementById('ogImage').content = imageUrl;
  document.getElementById('twitterImage').content = imageUrl;
  document.getElementById('articleStructuredData').textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'Article',
    headline: t(j.title, 'zh-TW'),
    description: t(j.lead, 'zh-TW'),
    image: imageUrl,
    datePublished: j.date,
    mainEntityOfPage: pageUrl,
    author: { '@type': 'Organization', name: 'Beky 佰客折疊車', url: siteUrl },
    publisher: { '@type': 'Organization', name: 'Beky 佰客折疊車', url: siteUrl }
  });

  // 圖片區塊只需渲染一次
  document.getElementById('jBody').innerHTML = j.blocks.map(b => {
    switch (b[0]) {
      case 'full':   return `<figure class="jb jb--full"><img src="${b[1]}" alt="" loading="lazy" decoding="async"></figure>`;
      case 'pair':   return `<div class="jb jb--pair ${b[3] || 'r34'}"><figure><img src="${b[1]}" alt="" loading="lazy" decoding="async"></figure><figure><img src="${b[2]}" alt="" loading="lazy" decoding="async"></figure></div>`;
      case 'single': return `<figure class="jb jb--single ${b[2] || 'r34'}"><img src="${b[1]}" alt="" loading="lazy" decoding="async"></figure>`;
      case 'text':   return `<p class="jb jb--text" data-i18n="${b[1]}"></p>`;
    }
  }).join('');

  function render(lang) {
    const title = `${t(j.title, lang)}｜Beky 佰客折疊車專題`;
    const description = `${t(j.lead, lang)} — Beky 佰客折疊車。`;
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageDescription').content = description;
    document.getElementById('ogTitle').content = title;
    document.getElementById('ogDescription').content = description;
    document.getElementById('ogImageAlt').content = `${t(j.title, lang)}｜Beky 佰客折疊車`;
    document.getElementById('twitterTitle').content = title;
    document.getElementById('twitterDescription').content = description;
    document.getElementById('jKicker').textContent = t(j.kicker, lang);
    document.getElementById('jTitle').textContent = t(j.title, lang);
    document.getElementById('jLead').textContent = t(j.lead, lang);
    const p = document.getElementById('jProduct');
    p.textContent = t(j.product.label, lang);
    p.href = `product.html?model=${j.product.model}`;
    document.querySelectorAll('.jb--text').forEach(el => { el.textContent = t(el.dataset.i18n, lang); });
  }

  render(getLang());
  document.addEventListener('langchange', e => render(e.detail.lang));
})();
</script>

<script>
(function () {
  const id = new URLSearchParams(location.search).get('model');
  const p = PRODUCTS[id] || PRODUCTS.youth;
  const key = PRODUCTS[id] ? id : 'youth';
  const siteUrl = 'https://vanson0308-boop.github.io/beky-folding-bike/';
  const pageUrl = `${siteUrl}product.html?model=${encodeURIComponent(key)}`;
  const imageUrl = new URL(p.img, siteUrl).href;
  const productPageCopy = {
    'zh-TW': {
      title: name => `佰客 Beky｜${name} 折疊車`,
      description: (name, desc) => `Beky 佰客${name}折疊車。${desc}`,
      imageAlt: name => `Beky 佰客${name}折疊車`,
    },
    en: {
      title: name => `佰客 Beky | ${name} Folding Bike`,
      description: (name, desc) => `The Beky ${name} folding bike. ${desc}`,
      imageAlt: name => `Beky ${name} folding bike`,
    },
    'zh-CN': {
      title: name => `佰客 Beky｜${name} 折叠车`,
      description: (name, desc) => `Beky 佰客${name}折叠车。${desc}`,
      imageAlt: name => `Beky 佰客${name}折叠车`,
    },
    ja: {
      title: name => `佰客 BEKY｜${name} 折りたたみ自転車`,
      description: (name, desc) => `BEKY（佰客）の${name}折りたたみ自転車。${desc}`,
      imageAlt: name => `BEKY（佰客）${name} 折りたたみ自転車`,
    },
  };

  document.getElementById('canonicalUrl').href = pageUrl;
  document.getElementById('ogUrl').content = pageUrl;
  document.getElementById('ogImage').content = imageUrl;
  document.getElementById('twitterImage').content = imageUrl;
  document.getElementById('productStructuredData').textContent = JSON.stringify({
    '@context': 'https://schema.org',
    '@type': 'Product',
    name: `Beky ${p.name['zh-TW']} 折疊車`,
    description: p.desc['zh-TW'],
    image: imageUrl,
    url: pageUrl,
    brand: { '@type': 'Brand', name: 'Beky 佰客' }
  });

  function render(lang) {
    const copy = productPageCopy[lang] || productPageCopy['zh-TW'];
    const title = copy.title(p.name[lang]);
    const description = copy.description(p.name[lang], p.desc[lang]);
    const imageAlt = copy.imageAlt(p.name[lang]);
    document.getElementById('pageTitle').textContent = title;
    document.getElementById('pageDescription').content = description;
    document.getElementById('ogTitle').content = title;
    document.getElementById('ogDescription').content = description;
    document.getElementById('ogImageAlt').content = imageAlt;
    document.getElementById('twitterTitle').content = title;
    document.getElementById('twitterDescription').content = description;
    document.getElementById('pImg').src = p.img;
    document.getElementById('pImg').alt = imageAlt;
    document.getElementById('pEn').textContent = p.en;
    document.getElementById('pName').textContent = p.name[lang];
    document.getElementById('pDesc').textContent = p.desc[lang];
    document.getElementById('pPrice').textContent = p.price || t('pd.price.tba', lang);

    document.getElementById('pColors').innerHTML = p.colors
      .map(([hex, n]) => `<span class="color"><i style="background:${hex}"></i>${n[lang]}</span>`).join('');

    document.getElementById('pSpecs').innerHTML = p.specs
      .map(([k, v]) => `<div><dt>${SPEC_LABELS[k][lang]}</dt><dd>${v}</dd></div>`).join('');

    document.getElementById('pOthers').innerHTML = Object.keys(PRODUCTS).filter(k => k !== key).slice(0, 3)
      .map(k => `<a href="product.html?model=${k}" class="card card--sm">
        <div class="card__img card__img--bike"><img src="${PRODUCTS[k].img}" alt="" loading="lazy" decoding="async"></div>
        <span class="card__title">${PRODUCTS[k].name[lang]}</span></a>`).join('');
  }

  render(getLang());
  document.addEventListener('langchange', e => render(e.detail.lang));
})();
</script>
